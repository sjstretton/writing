title: Working Paper
author: Stephen J. Stretton
version: 1.0.0
quarto-required: ">=1.5.0"
contributes:
  formats:
    common:
      number-sections: true
      date-format: "MMMM YYYY"
      filters:
        - working-paper.lua
      fig-cap-location: bottom
      tbl-cap-location: top
    typst:
      papersize: a4
      font-paths:
        - fonts
      template-partials:
        - typst-template.typ
        - typst-show.typ
      toc: false
      citeproc: true
      section-numbering: "1.1"
    docx:
      reference-doc: reference.docx
      toc: false
