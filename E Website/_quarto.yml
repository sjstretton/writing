project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "policy/*.qmd"
    - "policy/*/*/index.qmd"
    - "policy/*/*/working-paper.qmd"
    - "policy/books/*/*.qmd"
    - "modelling/*.qmd"
    - "modelling/*/*/index.qmd"
    - "modelling/*/*/working-paper.qmd"
  resources:
    - "papers/**"

# Two research parts, each with its own tab and sidebar (H Writing Instructions/Scripts/Website/site_config.py).
# The sidebar contents between the BEGIN/END markers are written by build_research_pages.py on every compile.
website:
  title: "Climate, Fiscal & Finance"
  description: "Research and writing on carbon pricing, fiscal policy, and climate finance."
  bread-crumbs: true
  navbar:
    right:
      - href: index.qmd
        text: Policy and Finance
      - href: modelling/index.qmd
        text: Modelling and Analytics
      - href: about.qmd
        text: About
  sidebar:
    - id: policy
      title: "Policy and Finance"
      style: docked
      collapse-level: 1
      contents:
        # BEGIN policy sidebar
        - text: "Policy and Finance"
          href: index.qmd
        - section: "1. Carbon Pricing"
          href: policy/1-carbon-pricing.qmd
          contents:
            - section: "1.1 Price Production and Consumption Separately"
              href: policy/1-carbon-pricing/OpenEconomyCarbonPricing/index.qmd
              contents:
                - text: "Working paper"
                  href: policy/1-carbon-pricing/OpenEconomyCarbonPricing/working-paper.qmd
            - section: "1.2 Feebates"
              href: policy/1-carbon-pricing/FeebatesAndOutputBasedRebating/index.qmd
              contents:
                - text: "Working paper"
                  href: policy/1-carbon-pricing/FeebatesAndOutputBasedRebating/working-paper.qmd
            - section: "1.3 Converting a VAT into a Destination Carbon Tax"
              href: policy/1-carbon-pricing/CarbonConsumptionTax/index.qmd
              contents:
                - text: "Working paper"
                  href: policy/1-carbon-pricing/CarbonConsumptionTax/working-paper.qmd
            - section: "1.4 Credit the Price Signal, Not the Payment"
              href: policy/1-carbon-pricing/IronSteelCBAM/index.qmd
              contents:
                - text: "Working paper"
                  href: policy/1-carbon-pricing/IronSteelCBAM/working-paper.qmd
        - section: "2. Other Tax and Fiscal Policy"
          href: policy/2-other-tax.qmd
          contents:
            - section: "2.1 Taxing Rent, Not Effort"
              href: policy/2-other-tax/RentTax/index.qmd
              contents:
                - text: "Working paper"
                  href: policy/2-other-tax/RentTax/working-paper.qmd
            - text: "2.2 Let Land Pay for the City"
              href: policy/2-other-tax/LandPaysForTheCity/index.qmd
        - section: "3. Finance and Risk"
          href: policy/3-finance-and-risk.qmd
          contents:
            - section: "3.1 Guarantee the Contract, Not the Debt"
              href: policy/3-finance-and-risk/ClimateFinanceIntermediationForCleanPower/index.qmd
              contents:
                - text: "Working paper"
                  href: policy/3-finance-and-risk/ClimateFinanceIntermediationForCleanPower/working-paper.qmd
            - section: "3.2 From Projects to Asset Classes"
              href: policy/3-finance-and-risk/CleanPowerAssetClasses/index.qmd
              contents:
                - text: "Working paper"
                  href: policy/3-finance-and-risk/CleanPowerAssetClasses/working-paper.qmd
        - section: "4. Sovereign Incentives"
          href: policy/4-sovereign-incentives.qmd
          contents:
            - section: "4.1 Reward the Stock as Well as the Flow"
              href: policy/4-sovereign-incentives/NotionalCapitalisedValueAndGuarantees/index.qmd
              contents:
                - text: "Working paper"
                  href: policy/4-sovereign-incentives/NotionalCapitalisedValueAndGuarantees/working-paper.qmd
            - section: "4.2 The Climate Investment Trust"
              href: policy/4-sovereign-incentives/ClimateInvestmentTrust/index.qmd
              contents:
                - text: "Working paper"
                  href: policy/4-sovereign-incentives/ClimateInvestmentTrust/working-paper.qmd
            - section: "4.3 Codify Sustainability-Linked Sovereign Lending, Then Give It Scale"
              href: policy/4-sovereign-incentives/SustainabilityLinkedLending/index.qmd
              contents:
                - text: "Working paper"
                  href: policy/4-sovereign-incentives/SustainabilityLinkedLending/working-paper.qmd
        - section: "Books and Other Papers"
          href: policy/more.qmd
          contents:
            - section: "Plucked!"
              href: policy/books/Plucked/index.qmd
              contents:
                - text: "1. Facing Global Risks Head On"
                  href: policy/books/Plucked/01-facing-global-risks-head-on.qmd
                - text: "2. Revolutions in the Minds of Men"
                  href: policy/books/Plucked/02-revolutions-in-the-minds-of-men.qmd
                - text: "3. Desert Island Economics"
                  href: policy/books/Plucked/03-desert-island-economics.qmd
                - text: "4. The Questions Posed by This Book"
                  href: policy/books/Plucked/04-the-questions-posed-by-this-book.qmd
                - text: "5. Tax in Principle"
                  href: policy/books/Plucked/05-tax-in-principle.qmd
                - text: "6. Tax in Practice"
                  href: policy/books/Plucked/06-tax-in-practice.qmd
                - text: "7. Welfare and Work"
                  href: policy/books/Plucked/07-welfare-and-work.qmd
                - text: "8. Income, Wealth and Inequality"
                  href: policy/books/Plucked/08-income-wealth-and-inequality.qmd
                - text: "9. Corporations"
                  href: policy/books/Plucked/09-corporations.qmd
                - text: "10. Land and Property"
                  href: policy/books/Plucked/10-land-and-property.qmd
                - text: "11. Money, Debt, and Finance"
                  href: policy/books/Plucked/11-money-debt-and-finance.qmd
                - text: "12. Environment, Health, and Resources"
                  href: policy/books/Plucked/12-environment-health-and-resources.qmd
                - text: "13. The Global Perspective: Climate, Fiscal Policy and Collective Action"
                  href: policy/books/Plucked/13-the-global-perspective-climate-fiscal-policy-and-collective-action.qmd
                - text: "13. Conclusions"
                  href: policy/books/Plucked/14-conclusions.qmd
        # END policy sidebar
    - id: modelling
      title: "Modelling and Analytics"
      style: docked
      collapse-level: 1
      contents:
        # BEGIN modelling sidebar
        - text: "Modelling and Analytics"
          href: modelling/index.qmd
        - modelling/5-modelling.qmd
        - modelling/6-modular-upgrades.qmd
        - modelling/7-analytics.qmd
        # END modelling sidebar
  page-footer:
    left: "© 2026"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: litera
      dark: darkly
    css: styles.css
    toc: true
    toc-location: left
    toc-title: "On this page"
    toc-depth: 2
    mainfont: "Source Serif Pro"
    monofont: "JetBrains Mono"
    fontsize: 1.05em
    linkcolor: "#1a5490"
    grid:
      body-width: 800px
