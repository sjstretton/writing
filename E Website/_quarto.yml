project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "policy/*.qmd"
    - "policy/*/*/index.qmd"
    - "policy/*/*/working-paper.qmd"
    - "policy/books/*/*.qmd"
    - "modelling/*.qmd"
    - "modelling/*/*/index.qmd"
    - "modelling/*/*/working-paper.qmd"
  resources:
    - "papers/**"

# Two research parts, each with its own tab and sidebar (H Writing Instructions/Scripts/Website/site_config.py).
# The sidebar contents between the BEGIN/END markers are written by build_research_pages.py on every compile.
website:
  title: "Climate Fiscal and Finance Papers"
  description: "Research and writing on carbon pricing, fiscal policy, and climate finance."
  bread-crumbs: true
  navbar:
    right:
      - href: index.qmd
        text: Home
      - href: policy/index.qmd
        text: Policy and Finance
      - href: modelling/index.qmd
        text: Modelling and Analytics
  sidebar:
    - id: policy
      title: "Policy and Finance"
      style: docked
      collapse-level: 1
      contents:
        # BEGIN policy sidebar
        - text: "Policy and Finance"
          href: policy/index.qmd
        - section: "1. Carbon Pricing"
          href: policy/1-carbon-pricing.qmd
          contents:
            - section: "1.1 Price Production and Consumption Separately"
              href: policy/1-carbon-pricing/OpenEconomyCarbonPricing/index.qmd
              contents:
                - text: "Working paper"
                  href: policy/1-carbon-pricing/OpenEconomyCarbonPricing/working-paper.qmd
            - section: "1.2 Feebates"
              href: policy/1-carbon-pricing/FeebatesAndOutputBasedRebating/index.qmd
              contents:
                - text: "Working paper"
                  href: policy/1-carbon-pricing/FeebatesAndOutputBasedRebating/working-paper.qmd
            - section: "1.3 Converting a VAT into a Destination Carbon Tax"
              href: policy/1-carbon-pricing/CarbonConsumptionTax/index.qmd
              contents:
                - text: "Working paper"
                  href: policy/1-carbon-pricing/CarbonConsumptionTax/working-paper.qmd
            - section: "1.4 Credit the Price Signal, Not the Payment"
              href: policy/1-carbon-pricing/IronSteelCBAM/index.qmd
              contents:
                - text: "Working paper"
                  href: policy/1-carbon-pricing/IronSteelCBAM/working-paper.qmd
            - text: "The Right Policy at the Wrong Time"
              href: policy/1-carbon-pricing.qmd#extra-the-right-policy-at-the-wrong-time
        - section: "2. Other Tax and Fiscal Policy"
          href: policy/2-other-tax.qmd
          contents:
            - section: "2.1 Taxing Rent, Not Effort"
              href: policy/2-other-tax/RentTax/index.qmd
              contents:
                - text: "Working paper"
                  href: policy/2-other-tax/RentTax/working-paper.qmd
            - text: "2.2 Let Land Pay for the City"
              href: policy/2-other-tax/LandPaysForTheCity/index.qmd
        - section: "3. Finance and Risk"
          href: policy/3-finance-and-risk.qmd
          contents:
            - section: "3.1 Guarantee the Contract, Not the Debt"
              href: policy/3-finance-and-risk/ClimateFinanceIntermediationForCleanPower/index.qmd
              contents:
                - text: "Working paper"
                  href: policy/3-finance-and-risk/ClimateFinanceIntermediationForCleanPower/working-paper.qmd
            - section: "3.2 From Projects to Asset Classes"
              href: policy/3-finance-and-risk/CleanPowerAssetClasses/index.qmd
              contents:
                - text: "Working paper"
                  href: policy/3-finance-and-risk/CleanPowerAssetClasses/working-paper.qmd
            - text: "Time and Chance"
              href: policy/3-finance-and-risk.qmd#extra-time-and-chance
        - section: "4. Sovereign Incentives"
          href: policy/4-sovereign-incentives.qmd
          contents:
            - section: "4.1 Reward the Stock as Well as the Flow"
              href: policy/4-sovereign-incentives/NotionalCapitalisedValueAndGuarantees/index.qmd
              contents:
                - text: "Working paper"
                  href: policy/4-sovereign-incentives/NotionalCapitalisedValueAndGuarantees/working-paper.qmd
            - section: "4.2 The Climate Investment Trust"
              href: policy/4-sovereign-incentives/ClimateInvestmentTrust/index.qmd
              contents:
                - text: "Working paper"
                  href: policy/4-sovereign-incentives/ClimateInvestmentTrust/working-paper.qmd
            - section: "4.3 Codify Sustainability-Linked Sovereign Lending, Then Give It Scale"
              href: policy/4-sovereign-incentives/SustainabilityLinkedLending/index.qmd
              contents:
                - text: "Working paper"
                  href: policy/4-sovereign-incentives/SustainabilityLinkedLending/working-paper.qmd
        # END policy sidebar
    - id: modelling
      title: "Modelling and Analytics"
      style: docked
      collapse-level: 1
      contents:
        # BEGIN modelling sidebar
        - text: "Modelling and Analytics"
          href: modelling/index.qmd
        - section: "5. Modelling (CPAT)"
          href: modelling/5-modelling.qmd
          contents:
            - section: "5.1 The CPAT Mitigation Module"
              href: modelling/5-modelling/CPATMitigationMethods/index.qmd
              contents:
                - text: "Working paper"
                  href: modelling/5-modelling/CPATMitigationMethods/working-paper.qmd
            - section: "5.2 CPAT-AI"
              href: modelling/5-modelling/CPATAIImplementation/index.qmd
              contents:
                - text: "Working paper"
                  href: modelling/5-modelling/CPATAIImplementation/working-paper.qmd
            - section: "5.3 Validating CPAT"
              href: modelling/5-modelling/CPATValidation/index.qmd
              contents:
                - text: "Working paper"
                  href: modelling/5-modelling/CPATValidation/working-paper.qmd
            - section: "5.4 Are CPAT's Price Elasticities Right?"
              href: modelling/5-modelling/ElasticityValidation/index.qmd
              contents:
                - text: "Working paper"
                  href: modelling/5-modelling/ElasticityValidation/working-paper.qmd
        - section: "6. Modular Upgrades"
          href: modelling/6-modular-upgrades.qmd
          contents:
            - section: "6.1 Measure Carbon Pricing by the Emissions It Cuts"
              href: modelling/6-modular-upgrades/PolicyEquivalentCarbonPriceAndCES/index.qmd
              contents:
                - text: "Working paper"
                  href: modelling/6-modular-upgrades/PolicyEquivalentCarbonPriceAndCES/working-paper.qmd
            - section: "6.2 The CBAM Policy Tool"
              href: modelling/6-modular-upgrades/CBAMPolicyTool/index.qmd
              contents:
                - text: "Working paper"
                  href: modelling/6-modular-upgrades/CBAMPolicyTool/working-paper.qmd
            - section: "6.3 Public Investment in CPAT"
              href: modelling/6-modular-upgrades/PublicInvestment/index.qmd
              contents:
                - text: "Working paper"
                  href: modelling/6-modular-upgrades/PublicInvestment/working-paper.qmd
            - section: "6.4 Activity Levels Across CPAT, SISEPUEDE, CBAM and FTT"
              href: modelling/6-modular-upgrades/ActivityModelling/index.qmd
              contents:
                - text: "Working paper"
                  href: modelling/6-modular-upgrades/ActivityModelling/working-paper.qmd
            - section: "6.5 The Macro-Fiscal-Energy Scenario Tool"
              href: modelling/6-modular-upgrades/MacroFiscalEnergyScenarioTool/index.qmd
              contents:
                - text: "Working paper"
                  href: modelling/6-modular-upgrades/MacroFiscalEnergyScenarioTool/working-paper.qmd
        - section: "7. Analytics Tools"
          href: modelling/7-analytics.qmd
          contents:
            - section: "7.1 The Excise-Fiscal Diagnostic"
              href: modelling/7-analytics/ExciseFiscalDiagnostic/index.qmd
              contents:
                - text: "Working paper"
                  href: modelling/7-analytics/ExciseFiscalDiagnostic/working-paper.qmd
            - section: "7.2 A Global Fiscal Indicators Dashboard for Climate-Fiscal Analysis"
              href: modelling/7-analytics/FiscalIndicatorsDashboard/index.qmd
              contents:
                - text: "Working paper"
                  href: modelling/7-analytics/FiscalIndicatorsDashboard/working-paper.qmd
        # END modelling sidebar
  page-footer:
    left: "© 2026"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: litera
      dark: darkly
    css: styles.css
    toc: true
    toc-location: left
    toc-title: "On this page"
    toc-depth: 2
    mainfont: "Source Serif Pro"
    monofont: "JetBrains Mono"
    fontsize: 1.05em
    linkcolor: "#1a5490"
    grid:
      body-width: 800px
