project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "research/*.qmd"
  resources:
    - "papers/**"

website:
  title: "Climate, Fiscal & Finance"
  description: "Research and writing on carbon pricing, fiscal policy, and climate finance."
  navbar:
    right:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: about.qmd
        text: About
      - href: contact.qmd
        text: Contact
  sidebar:
    - id: research
      title: "Research"
      style: docked
      collapse-level: 1
      contents:
        - text: "Research home"
          href: research.qmd
        - research/1-carbon-pricing.qmd
        - research/2-other-tax.qmd
        - research/3-finance-and-risk.qmd
        - research/4-sovereign-incentives.qmd
        - research/5-modelling.qmd
        - research/6-modular-upgrades.qmd
        - research/7-analytics.qmd
        - research/more.qmd
  page-footer:
    left: "© 2026"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: litera
      dark: darkly
    css: styles.css
    toc: false
    mainfont: "Source Serif Pro"
    monofont: "JetBrains Mono"
    fontsize: 1.05em
    linkcolor: "#1a5490"
    grid:
      body-width: 800px